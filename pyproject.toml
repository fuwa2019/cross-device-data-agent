[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-device-data-agent"
version = "0.1.0"
description = "Read-only offline file inventory and evidence-based experiment catalog"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
data-agent = "data_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
